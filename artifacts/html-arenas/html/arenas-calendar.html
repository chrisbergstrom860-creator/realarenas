<!DOCTYPE html>
<html lang="en">
<head>
<script>
window.BASE = window.location.pathname.startsWith('/html') ? '/html' : '';
window.nav = function(path){ window.location.href = window.BASE + path; };
document.addEventListener('DOMContentLoaded', function(){
  if (window.BASE === '') {
    document.querySelectorAll('[href^="/html/"]').forEach(function(el){ el.setAttribute('href', el.getAttribute('href').slice(5)); });
    document.querySelectorAll('[action^="/html/"]').forEach(function(el){ el.setAttribute('action', el.getAttribute('action').slice(5)); });
  }
});
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/html/manifest.webmanifest">
<meta name="theme-color" content="#FFD21E">
<link rel="icon" href="/html/favicon.ico" sizes="48x48">
<link rel="icon" href="/html/arenas-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/html/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arenas">
<script src="/html/arenas-pwa.js" defer></script>
<title>Arenas — Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/html/arenas.css">
<script src="/html/arenas-club-create.js"></script>
<style>
/* Calendar gets a wider shell than the 1176px default: the docked day panel
   (360px) needs room beside a readable 7-column grid. Page-local override. */
:root{--shell-max:1600px}
button{font-family:var(--font)}
.notif-btn:hover{background:var(--gray-50)}
.main{display:block;padding:26px 32px 60px}
.cal-shell{max-width:1440px;margin:0 auto}

/* ── Header ── */
.cal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.cal-head-left{min-width:0}
.cal-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cal-month-label{font-size:26px;font-weight:700;color:var(--gray-900);letter-spacing:-.015em;line-height:1.15;margin:0;min-width:0}
.page-sub{font-size:13px;color:var(--gray-500);margin-top:4px}
.cal-monthnav{display:flex;align-items:center;gap:6px}
.cal-nav-btn{width:34px;height:34px;border-radius:8px;border:var(--border);background:white;cursor:pointer;font-size:16px;color:var(--gray-700);display:flex;align-items:center;justify-content:center;transition:background .1s}
.cal-nav-btn:hover{background:var(--gray-50)}
.cal-today-btn{height:34px;padding:0 14px;border-radius:8px;border:var(--border);background:white;cursor:pointer;font-size:13px;font-weight:600;color:var(--gray-700);transition:background .1s}
.cal-today-btn:hover{background:var(--gray-50)}
.cal-nav-btn:focus-visible,.cal-today-btn:focus-visible,.view-toggle button:focus-visible,.add-btn:focus-visible,.add-menu button:focus-visible,.dp-btn:focus-visible,.dp-navbtn:focus-visible,.cal-day:focus-visible,.wk-day:focus-visible,.ag-head:focus-visible{outline:2px solid var(--gray-900);outline-offset:2px}
.cal-head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.view-toggle{display:flex;border:var(--border);border-radius:9px;overflow:hidden;background:white}
.view-toggle button{height:34px;padding:0 16px;border:none;background:white;font-size:13px;font-weight:600;color:var(--gray-600);cursor:pointer}
.view-toggle button+button{border-left:var(--border)}
.view-toggle button.on{background:var(--gray-900);color:white}

/* ── + Add dropdown ── */
.add-wrap{position:relative}
.add-btn{height:34px;padding:0 12px 0 14px;border-radius:9px;border:1px solid var(--yellow-dark);background:var(--yellow);color:var(--gray-900);font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.add-btn:hover{filter:brightness(.97)}
.add-caret{font-size:10px;border-left:1px solid rgba(17,24,39,.2);padding-left:8px}
.add-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:220px;background:white;border:var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:5px;z-index:320}
.add-menu.open{display:block}
.add-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;background:none;border-radius:7px;font-size:13px;font-weight:600;color:var(--gray-800);cursor:pointer;text-align:left}
.add-menu button:hover,.add-menu button:focus{background:var(--gray-50)}
.add-menu .am-sub{display:block;font-size:11px;font-weight:400;color:var(--gray-500)}

/* ── Stats row (Challenges tinted-emoji tile language) ── */
.cal-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.cs-tile{display:flex;align-items:center;gap:12px;background:white;border:var(--border);border-radius:var(--radius-lg);padding:14px 16px;min-width:0}
.cs-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.cs-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.cs-label{font-size:12px;color:var(--gray-600);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-val{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--gray-900);line-height:1.15;white-space:nowrap}
.cs-val small{font-family:var(--font);font-size:12px;font-weight:500;color:var(--gray-500)}
.cs-sub{font-size:11px;color:var(--gray-500);white-space:nowrap}
.sk{background:linear-gradient(90deg,var(--gray-100),var(--gray-50),var(--gray-100));background-size:200% 100%;animation:sk 1.2s ease-in-out infinite;border-radius:6px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Two-column layout: views left, docked day panel right (>1024px) ── */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.cal-left{min-width:0}

/* ── MONTH GRID ── */
.cal-labels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:2px 0 6px;font-size:11px;color:var(--gray-500);text-align:center;text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 0 14px}
.cal-day{min-height:128px;min-width:0;border-radius:10px;border:var(--border);background:white;padding:7px 6px;cursor:pointer;display:flex;flex-direction:column;gap:5px;overflow:hidden;transition:border-color .1s,background .1s}
.cal-day:hover{border-color:var(--gray-400)}
.cd-empty{background:transparent;border:1px dashed var(--gray-100);cursor:default}
.cd-empty:hover{border-color:var(--gray-100)}
.cd-num{font-size:13px;font-weight:600;color:var(--gray-600);font-family:var(--mono);line-height:1;padding:3px 5px;border-radius:5px;align-self:flex-start}
.cd-today .cd-num{color:var(--gray-900);background:var(--yellow)}
.cal-day.is-sel{border-color:var(--gray-900);box-shadow:0 0 0 2px var(--gray-900)}
.cal-day.is-sel .cd-num{background:var(--gray-900);color:white}
.cd-pills{display:flex;flex-direction:column;gap:3px;min-width:0}
.cd-more{font-size:11px;color:var(--gray-600);font-family:var(--mono);padding-left:4px}
.cd-dots{display:none;align-items:center;gap:3px;flex-wrap:wrap}
.cd-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cd-dot.ev{background:var(--yellow-dark)}
.cd-dot.nr{background:transparent;border:1.5px solid var(--gray-500)}
.cd-dot.plan{background:#7C3AED}

/* ── Pill component (month cells, week, agenda) — explicit states, no opacity ── */
.cp{display:flex;flex-direction:column;gap:1px;min-width:0;padding:4px 6px;border-radius:6px;background:var(--pbg,#F3F4F6);color:var(--ptx,#374151);border:1px solid var(--pbd,transparent);line-height:1.25}
.cp-l1{display:flex;align-items:center;gap:4px;min-width:0;font-size:12px;font-weight:600}
.cp-ic{flex-shrink:0;font-size:12px}
.cp-t,.cp-l2{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-l2{font-size:11px;font-weight:500;font-family:var(--mono);letter-spacing:-.01em}
.cp.ev{--pbg:var(--yellow-light);--ptx:#6B5000;--pbd:#F7E3A1}
.cp.nr{--pbg:white;--ptx:#4B5563;--pbd:#9CA3AF;border-style:dashed}
.cp.plan{--pbg:#F5F3FF;--ptx:#5B21B6;--pbd:#DDD6FE}
.cp.plan.done{--pbg:#6D28D9;--ptx:#FFFFFF;--pbd:#6D28D9}
.cp.plan.skipped{--pbg:#F3F4F6;--ptx:#4B5563;--pbd:#E5E7EB}
.cp.plan.skipped .cp-t{text-decoration:line-through}
.cp-lg{padding:7px 10px;border-radius:8px;flex:0 1 220px}
.cp-lg .cp-l1{font-size:13px}
.cp-lg .cp-l2{font-size:12px}

/* ── WEEK + AGENDA (same pill component, day cards) ── */
.agenda{display:flex;flex-direction:column;gap:8px}
.ag-day{background:white;border:var(--border);border-radius:10px;overflow:hidden}
.ag-day.today .ag-date::after{content:''}
.wk-day{cursor:pointer}
.wk-day:hover{border-color:var(--gray-400)}
.ag-day.is-sel{border-color:var(--gray-900);box-shadow:0 0 0 2px var(--gray-900)}
.ag-head{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:var(--border);background:var(--gray-50);cursor:pointer}
.ag-date{font-size:13px;font-weight:700;color:var(--gray-900)}
.ag-today-tag{font-size:10px;font-weight:700;background:var(--yellow);color:var(--gray-900);border-radius:4px;padding:2px 6px;text-transform:uppercase;letter-spacing:.04em}
.ag-pills{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px}
.wk-rest{padding:11px 14px;font-size:12px;color:var(--gray-500)}

/* ── Status chips ── */
.chip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;flex-shrink:0;white-space:nowrap}
.chip.going{background:var(--yellow);color:var(--gray-900);border:1px solid var(--yellow-dark)}
.chip.interested{background:var(--yellow-light);color:#6B5000;border:1px solid #F7E3A1}
.chip.nr{background:white;color:#4B5563;border:1px dashed #9CA3AF}
.chip.planned{background:#F5F3FF;color:#5B21B6;border:1px solid #DDD6FE}
.chip.done{background:#6D28D9;color:white;border:1px solid #6D28D9}
.chip.skipped{background:#F3F4F6;color:#4B5563;border:1px solid #E5E7EB}

/* ── DAY PANEL: docked sticky column >1024px, bottom sheet ≤1024px ── */
.dp-wrap{position:sticky;top:calc(var(--topbar-h) + 16px);max-height:calc(100vh - var(--topbar-h) - 32px);display:flex}
.dp-sheet{background:white;border:var(--border);border-radius:14px;display:flex;flex-direction:column;width:100%;max-height:inherit;overflow:hidden}
.dp-header{display:flex;align-items:center;gap:8px;padding:14px 16px 12px;border-bottom:var(--border);flex-shrink:0}
.dp-title{font-size:15px;font-weight:700;color:var(--gray-900);flex:1;min-width:0;margin:0}
.dp-navbtn{width:30px;height:30px;border-radius:7px;border:var(--border);background:white;cursor:pointer;font-size:15px;color:var(--gray-700);display:flex;align-items:center;justify-content:center}
.dp-navbtn:hover{background:var(--gray-50)}
.dp-close{display:none}
.dp-body{padding:14px 16px 18px;overflow-y:auto;flex:1}
.dp-section{margin-bottom:18px}
.dp-section:last-child{margin-bottom:0}
.dp-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dp-section-label{font-size:13px;font-weight:700;color:var(--gray-900);margin:0}
.dp-link{background:none;border:none;padding:0;font-size:12px;font-weight:600;color:var(--gray-700);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.dp-empty{font-size:12px;color:var(--gray-500)}
.dp-nothing{text-align:center;padding:26px 10px 8px}
.dp-nothing-ic{font-size:26px;margin-bottom:6px}
.dp-nothing-t{font-size:14px;font-weight:700;color:var(--gray-900);margin-bottom:4px}
.dp-nothing-s{font-size:12px;color:var(--gray-500);margin-bottom:14px}
.dp-nothing .dp-act-row{justify-content:center}
.dp-card{border:var(--border);border-radius:11px;padding:12px;margin-bottom:8px;background:white}
.dp-card:last-child{margin-bottom:0}
.dc-top{display:flex;align-items:center;gap:10px;min-width:0}
.dc-ic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--pbg,#F3F4F6);color:var(--ptx,#374151)}
.dc-main{min-width:0;flex:1}
.dc-title{font-size:14px;font-weight:700;color:var(--gray-900);overflow-wrap:anywhere}
.dc-sub{font-size:12px;color:var(--gray-500)}
.dc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--gray-100)}
.dc-stat b{display:block;font-family:var(--mono);font-size:15px;font-weight:600;color:var(--gray-900);line-height:1.2}
.dc-stat span{font-size:11px;color:var(--gray-500)}
.dc-notes{margin-top:10px;font-size:13px;color:var(--gray-700);background:var(--gray-50);border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.dc-notes-l{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-500);margin-bottom:2px}
.dp-card.plan{border-left:3px solid #7C3AED}
.dp-card.plan.done{border-left-color:#6D28D9}
.dp-card.plan.skipped{border-left-color:#9CA3AF}
.dp-card.plan.skipped .dc-title{text-decoration:line-through;color:var(--gray-600)}
.dp-card.ev{border-left:3px solid var(--yellow-dark)}
.dp-card.ev.nr{border-left:3px dashed #9CA3AF}
.dc-meta{font-size:12px;color:var(--gray-600);margin-top:6px}
.dc-openlink{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;color:var(--gray-800);text-decoration:underline;text-underline-offset:2px}
.dp-act-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.dp-btn{padding:6px 11px;border-radius:7px;border:var(--border);background:white;font-size:12px;font-weight:600;color:var(--gray-700);cursor:pointer;transition:background .1s}
.dp-btn:hover{background:var(--gray-50)}
.dp-btn.primary{background:var(--yellow);border-color:var(--yellow-dark);color:var(--gray-900)}
.dp-btn.danger{color:#A32D2D;border-color:#FECACA}
.dp-btn:disabled{opacity:.5;cursor:default}
.ag-meta{font-size:12px;color:var(--gray-500)}
.dp-form{background:var(--gray-50);border:var(--border);border-radius:10px;padding:12px;margin:8px 0}
.dp-form .fi{margin-bottom:9px}
.dp-form label{font-size:11px;font-weight:600;color:var(--gray-600);display:block;margin-bottom:3px}
.dp-form label .opt{font-weight:400;color:var(--gray-500)}
.dp-form input,.dp-form select,.dp-form textarea{width:100%;padding:8px 10px;border:var(--border);border-radius:7px;font-size:13px;font-family:var(--font);background:white;color:var(--gray-900)}
.dp-form textarea{resize:vertical;min-height:44px}
.dp-form-err{display:none;background:var(--red-light);border:1px solid #FECACA;border-radius:7px;padding:7px 10px;font-size:12px;color:#A32D2D;margin-bottom:9px}
#cal-toast{display:none;position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--gray-900);color:white;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;z-index:700;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.empty-state{background:white;border:var(--border);border-radius:12px;padding:36px 24px;text-align:center;color:var(--gray-500);font-size:13px}
.empty-state .dp-act-row{justify-content:center;margin-top:14px}

@media (max-width:1024px){
  .cal-layout{grid-template-columns:minmax(0,1fr)}
  .cal-stats{grid-template-columns:repeat(6,minmax(0,1fr))}
  .cal-stats .cs-tile{grid-column:span 2}
  .cal-stats .cs-tile:nth-child(4),.cal-stats .cs-tile:nth-child(5){grid-column:span 3}
  /* Bottom sheet — same content as the docked panel */
  .dp-wrap{display:none;position:fixed;inset:0;top:0;max-height:none;background:rgba(0,0,0,.45);z-index:500;align-items:flex-end;backdrop-filter:blur(3px)}
  .dp-wrap.open{display:flex}
  .dp-sheet{border-radius:14px 14px 0 0;max-height:78vh;border:none;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
  .dp-close{display:flex;border-radius:50%}
}
@media (max-width:768px){
  .main{padding:18px 14px 90px}
  .cal-month-label{font-size:21px}
  .cal-head-right{width:100%;justify-content:space-between}
  .cal-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .cal-stats .cs-tile,.cal-stats .cs-tile:nth-child(4){grid-column:span 1}
  .cal-stats .cs-tile:nth-child(5){grid-column:1 / -1}
  .cs-tile{padding:11px 12px;gap:10px}
  .cs-icon{width:36px;height:36px;font-size:16px}
  .cs-val{font-size:17px}
  .cal-day{min-height:64px;padding:5px 4px}
  .cd-num{font-size:12px;padding:2px 4px}
  .cd-pills{display:none}
  .cd-dots{display:flex}
  .cp-lg{flex:1 1 140px}
}
</style>
</head>
<body>
<div class="app">

<!-- TOPBAR -->
<header class="topbar">
  <div class="topbar-logo" onclick="nav('/feed')" style="cursor:pointer">
    <img class="logo-icon" src="/html/arenas-icon.svg" alt="">
    <span class="logo-text">Arenas</span>
  </div>
  <div class="topbar-center">
    <div class="topbar-search">
      <span style="color:var(--gray-400);font-size:13px">🔍</span>
      <input type="text" placeholder="Search athletes…" onkeydown="if(event.key==='Enter'&&!event.isComposing&&this.value.trim())nav('/athletes?q='+encodeURIComponent(this.value.trim()))">
    </div>
  </div>
  <div class="topbar-actions">
    <div class="notif-btn" onclick="nav('/notifications')">🔔<div class="notif-dot"></div></div>
    <div style="position:relative" onmouseleave="document.getElementById('userMenu').style.display='none'">
      <div class="user-av user-initials" onclick="var d=document.getElementById('userMenu');d.style.display=(d.style.display==='block'?'none':'block')" style="cursor:pointer">·</div>
      <div id="userMenu" style="display:none;position:absolute;right:0;top:calc(100% + 8px);background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:170px;z-index:300;overflow:hidden">
        <a href="/html/profile" style="display:block;padding:10px 14px;font-size:13px;color:#111827;text-decoration:none">My profile</a>
        <a href="/html/auth/logout" style="display:block;padding:10px 14px;font-size:13px;color:#DC2626;text-decoration:none;border-top:1px solid #f3f4f6">Log out</a>
      </div>
    </div>
  </div>
</header>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="nav-section-label">My Arenas</div>
  <div class="nav-item" onclick="nav('/feed')"><span class="nav-icon">🏠</span> Feed</div>
  <div class="nav-item" onclick="nav('/profile')"><span class="nav-icon">👤</span> My profile</div>
  <div class="nav-item" onclick="nav('/events')"><span class="nav-icon">🎟️</span> Events</div>
  <div class="nav-item active"><span class="nav-icon">🗓️</span> Calendar</div>
  <div class="nav-item" onclick="nav('/leaderboards')"><span class="nav-icon">🏆</span> Leaderboards</div>
  <div class="nav-item" onclick="nav('/challenges')"><span class="nav-icon">⚡</span> Challenges</div>
  <div class="nav-item" onclick="nav('/log')"><span class="nav-icon">➕</span> Log activity</div>
  <div class="nav-item" onclick="nav('/athletes')"><span class="nav-icon">👥</span> Athletes</div>
  <div class="nav-item" onclick="nav('/clubs')"><span class="nav-icon">🏟️</span> Clubs</div>
  <div class="nav-section-label">My clubs</div>
  <div class="nav-section-label">Account</div>
  <div class="nav-item" onclick="nav('/billing')"><span class="nav-icon">💳</span> Billing</div>
  <div class="nav-item" onclick="nav('/profile#settings')"><span class="nav-icon">⚙️</span> Settings</div>
  <div class="sidebar-footer">
    <div style="display:flex;align-items:center;gap:9px">
      <div class="user-initials sf-av" style="width:30px;height:30px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--gray-900);overflow:hidden">·</div>
      <div><div class="user-name" style="font-size:12px;font-weight:600;color:var(--gray-900)"></div></div>
    </div>
  </div>
</aside>

<!-- MAIN -->
<!-- MAIN -->
<div class="main">
<div class="cal-shell">
  <div class="cal-head">
    <div class="cal-head-left">
      <div class="cal-title-row">
        <h1 class="cal-month-label" id="cal-month-label" aria-live="polite">…</h1>
        <div class="cal-monthnav">
          <button class="cal-nav-btn" id="cal-prev" aria-label="Previous month">‹</button>
          <button class="cal-nav-btn" id="cal-next" aria-label="Next month">›</button>
          <button class="cal-today-btn" id="cal-today-btn">Today</button>
        </div>
      </div>
      <div class="page-sub">Your training, events and activities — all in one place.</div>
    </div>
    <div class="cal-head-right">
      <div class="view-toggle" role="tablist" aria-label="Calendar view">
        <button id="vt-month" role="tab">Month</button>
        <button id="vt-week" role="tab">Week</button>
        <button id="vt-agenda" role="tab">Agenda</button>
      </div>
      <div class="add-wrap">
        <button class="add-btn" id="add-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="add-menu">+ Add <span class="add-caret" aria-hidden="true">▾</span></button>
        <div class="add-menu" id="add-menu" role="menu" aria-labelledby="add-btn">
          <button role="menuitem" tabindex="-1" data-add="log"><span aria-hidden="true">➕</span><span>Log activity<span class="am-sub" id="am-log-sub"></span></span></button>
          <button role="menuitem" tabindex="-1" data-add="plan"><span aria-hidden="true">🗓️</span><span>Plan a session<span class="am-sub" id="am-plan-sub"></span></span></button>
          <button role="menuitem" tabindex="-1" data-add="event"><span aria-hidden="true">🎟️</span><span>Create event<span class="am-sub">On the Events page</span></span></button>
        </div>
      </div>
    </div>
  </div>

  <section class="cal-stats" id="cal-stats" aria-label="Month stats"></section>

  <div class="cal-layout">
    <div class="cal-left">
      <div id="cal-root"></div>
    </div>
    <!-- DAY PANEL: docked (complementary) >1024px; bottom sheet (dialog) ≤1024px -->
    <div class="dp-wrap" id="day-panel">
      <div class="dp-sheet" id="dp-sheet">
        <div class="dp-header">
          <h2 class="dp-title" id="dp-title">…</h2>
          <button class="dp-navbtn" id="dp-prev" aria-label="Previous day">‹</button>
          <button class="dp-navbtn" id="dp-next" aria-label="Next day">›</button>
          <button class="dp-navbtn dp-close" id="dp-close" aria-label="Close">✕</button>
        </div>
        <div class="dp-body" id="dp-body"></div>
      </div>
    </div>
  </div>
</div>
</div>

</div>

<div id="cal-toast" role="status"></div>

<script>
// ── Calendar page. All rendering is from /api/calendar/month — nothing is
// fabricated client-side. Timestamps (events, activities) are bucketed by
// LOCAL date parts; plan dates are already local YYYY-MM-DD strings.
(function () {
  var root = document.getElementById('cal-root');
  var monthLabel = document.getElementById('cal-month-label');
  var statsEl = document.getElementById('cal-stats');
  var panelWrap = document.getElementById('day-panel');
  var panelSheet = document.getElementById('dp-sheet');
  var VIEW_KEY = 'arenas_calendar_view'; // notifications-panel key precedent
  var HASH_RE = /^#(\d{4})-(\d{2})$/;
  // Week view is date-anchored: #YYYY-MM-DD is the displayed week's MONDAY.
  var WEEK_HASH_RE = /^#(\d{4})-(\d{2})-(\d{2})$/;
  // >1024px: the day panel is a docked column that always shows the selected
  // day. ≤1024px: the same content renders in a bottom sheet opened on demand.
  var dockMq = window.matchMedia('(min-width: 1025px)');
  function docked() { return dockMq.matches; }
  var FEELING_FALLBACK = { strong: 'Strong', tired: 'Tired', motivated: 'Motivated', struggled: 'Struggled', sore: 'Sore', easy: 'Easy' };
  var FEELING_EMOJI = { strong: '💪', tired: '😴', motivated: '🔥', struggled: '😤', sore: '🤕', easy: '😊' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function sportIcon(id) {
    var icons = window.ARENAS_SPORT_ICONS || {};
    return icons[id] || '🏅';
  }
  function sportEntry(id) {
    var reg = window.ARENAS_SPORTS || [];
    for (var i = 0; i < reg.length; i++) if (reg[i].id === id) return reg[i];
    return null;
  }
  function sportName(id) {
    var s = sportEntry(id);
    if (s) return s.label;
    return id ? (String(id).charAt(0).toUpperCase() + String(id).slice(1)) : 'Activity';
  }
  // Registry bg/text pair (verify-sport-colors.js guarantees ≥4.5:1). Unknown
  // sports fall back to a neutral pair that also clears AA.
  function sportColors(id) {
    var s = sportEntry(id);
    var c = s && s.colors;
    return c ? { bg: c.bg, text: c.text, border: c.border || c.bg } : { bg: '#F3F4F6', text: '#374151', border: '#E5E7EB' };
  }
  function sportVars(id) {
    var c = sportColors(id);
    return '--pbg:' + esc(c.bg) + ';--ptx:' + esc(c.text) + ';--pbd:' + esc(c.border);
  }
  function feelingLabel(f) {
    var labels = window.ARENAS_ACTIVITY_FEELING_LABELS || FEELING_FALLBACK;
    return labels[f] || FEELING_FALLBACK[f] || (f ? String(f).charAt(0).toUpperCase() + String(f).slice(1) : '');
  }
  // "1h 42m" / "45m" / "2h"
  function fmtMinutes(mins) {
    var m = Math.round(Number(mins) || 0);
    if (m <= 0) return '0m';
    var h = Math.floor(m / 60), r = m % 60;
    if (!h) return r + 'm';
    return r ? h + 'h ' + r + 'm' : h + 'h';
  }
  function fmtKm(km) {
    var n = Number(km);
    if (km == null || isNaN(n)) return null;
    return (Math.round(n * 10) / 10).toFixed(1) + ' km';
  }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function ymdOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  // TEST HOOK: ?_today=YYYY-MM-DD overrides the client's idea of "today" so the
  // week view's boundary math can be exercised deterministically. Display-only.
  var TODAY_OVERRIDE = (function () {
    var m = /[?&]_today=(\d{4}-\d{2}-\d{2})(?:&|$)/.exec(window.location.search);
    return m ? m[1] : null;
  })();
  // Day bucketing uses browser-local Date getters; server month stats use account timezone, which may differ.
  function nowLocal() { return TODAY_OVERRIDE ? parseLocalYmd(TODAY_OVERRIDE) : new Date(); }
  function todayYmd() { return TODAY_OVERRIDE || ymdOf(new Date()); }
  function parseLocalYmd(s) {
    var p = String(s).split('-').map(Number);
    return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
  }
  function mondayOf(d) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7));
  }
  function ymdAddDays(ymd, days) {
    var p = ymd.split('-').map(Number);
    return ymdOf(new Date(p[0], p[1] - 1, p[2] + days));
  }
  var EMPTY_DAY = function () { return { events: [], plans: [], activities: [] }; };

  // ── State ──
  var state = {
    year: 0, month: 0,           // month is 1-12
    view: 'month',
    data: null,
    byDay: {},                   // month-trimmed buckets (grid, agenda)
    byDayWide: {},               // untrimmed (week view, day panel)
    openYmd: null,               // selected day (docked) / open sheet day
    weekStart: null
  };
  var proLocked = !!(window.ARENAS_DATA && window.ARENAS_DATA.gating && window.ARENAS_DATA.gating.proLocked);
  var panelForm = null;          // null | {mode:'create'} | {mode:'edit', planId}
  var panelDeleteId = null;      // plan id showing the series delete choice row
  var sheetReturnFocus = null;

  function toast(msg) {
    var t = document.getElementById('cal-toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.style.display = 'none'; }, 2600);
  }
  function api(method, path, body) {
    return fetch(window.BASE + path, {
      method: method,
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        return { ok: r.ok, status: r.status, json: j || {} };
      });
    });
  }
  function errText(r) {
    var j = r.json || {};
    if (j.error === 'pro_required') return 'Planning sessions is a Pro feature — upgrade from your Billing page.';
    return j.message || (typeof j.error === 'string' ? j.error : null) || 'Something went wrong — please try again.';
  }

  function currentYm() { return state.year + '-' + pad2(state.month); }

  function initFromHash() {
    var h = window.location.hash || '';
    var wm = WEEK_HASH_RE.exec(h);
    if (wm) {
      var d = new Date(Number(wm[1]), Number(wm[2]) - 1, Number(wm[3]));
      if (d.getMonth() + 1 === Number(wm[2])) {
        var ws = mondayOf(d);
        state.weekStart = ymdOf(ws);
        state.year = ws.getFullYear(); state.month = ws.getMonth() + 1;
        return true;
      }
    }
    var m = HASH_RE.exec(h);
    if (m && Number(m[2]) >= 1 && Number(m[2]) <= 12) {
      state.year = Number(m[1]); state.month = Number(m[2]);
    } else {
      var n = nowLocal();
      state.year = n.getFullYear(); state.month = n.getMonth() + 1;
    }
    return false;
  }
  function initView() {
    var stored = null;
    try { stored = localStorage.getItem(VIEW_KEY); } catch (e) {}
    if (stored === 'month' || stored === 'week' || stored === 'agenda') { state.view = stored; return; }
    // Mobile default is WEEK (Monday weeks everywhere in the app); desktop month.
    state.view = (window.innerWidth <= 768) ? 'week' : 'month';
  }
  function ensureWeek() {
    var n = nowLocal();
    var anchor = currentYm() === (n.getFullYear() + '-' + pad2(n.getMonth() + 1))
      ? n : parseLocalYmd(currentYm() + '-01');
    var ws = mondayOf(anchor);
    state.weekStart = ymdOf(ws);
    var changed = ws.getFullYear() !== state.year || (ws.getMonth() + 1) !== state.month;
    state.year = ws.getFullYear(); state.month = ws.getMonth() + 1;
    return changed;
  }
  function setView(v) {
    state.view = v;
    try { localStorage.setItem(VIEW_KEY, v); } catch (e) {}
    if (v === 'week' && ensureWeek()) {
      renderToggle(); syncHash(); load();
      return;
    }
    renderToggle(); syncHash(); updateLabel(); render();
  }
  function renderToggle() {
    [['vt-month', 'month'], ['vt-week', 'week'], ['vt-agenda', 'agenda']].forEach(function (pair) {
      var btn = document.getElementById(pair[0]);
      var on = state.view === pair[1];
      btn.className = on ? 'on' : '';
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
      btn.setAttribute('tabindex', on ? '0' : '-1');
    });
    var unit = state.view === 'week' ? 'week' : 'month';
    document.getElementById('cal-prev').setAttribute('aria-label', 'Previous ' + unit);
    document.getElementById('cal-next').setAttribute('aria-label', 'Next ' + unit);
  }

  function shiftMonth(delta) {
    var m = state.month + delta;
    var y = state.year;
    while (m < 1) { m += 12; y -= 1; }
    while (m > 12) { m -= 12; y += 1; }
    state.year = y; state.month = m;
    syncHash(); load();
  }
  function shiftWeek(delta) {
    var ws = parseLocalYmd(state.weekStart);
    ws = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + delta * 7);
    state.weekStart = ymdOf(ws);
    var y = ws.getFullYear(), m = ws.getMonth() + 1;
    if (y !== state.year || m !== state.month) {
      state.year = y; state.month = m;
      syncHash(); load();
    } else {
      syncHash(); updateLabel(); render();
    }
  }
  function goToday() {
    var n = nowLocal();
    if (state.view === 'week') {
      var ws = mondayOf(n);
      state.weekStart = ymdOf(ws);
      state.year = ws.getFullYear(); state.month = ws.getMonth() + 1;
    } else {
      state.year = n.getFullYear(); state.month = n.getMonth() + 1;
    }
    if (docked()) { state.openYmd = todayYmd(); panelForm = null; panelDeleteId = null; }
    syncHash(); load();
  }
  function syncHash(replace) {
    var want = (state.view === 'week' && state.weekStart)
      ? '#' + state.weekStart
      : '#' + currentYm();
    if (window.location.hash === want) return;
    if (replace) {
      history.replaceState(null, '', window.location.pathname + window.location.search + want);
    } else {
      suppressHash = true;
      window.location.hash = want;
    }
  }
  var suppressHash = false;
  window.addEventListener('hashchange', function () {
    if (suppressHash) { suppressHash = false; return; }
    var h = window.location.hash || '';
    var wm = WEEK_HASH_RE.exec(h);
    if (wm) {
      var d = new Date(Number(wm[1]), Number(wm[2]) - 1, Number(wm[3]));
      if (d.getMonth() + 1 === Number(wm[2])) {
        state.view = 'week';
        var ws = mondayOf(d);
        state.weekStart = ymdOf(ws);
        state.year = ws.getFullYear(); state.month = ws.getMonth() + 1;
        renderToggle(); syncHash(true); load();
      } else {
        syncHash(true);
      }
      return;
    }
    var m = HASH_RE.exec(h);
    if (m && Number(m[2]) >= 1 && Number(m[2]) <= 12) {
      state.year = Number(m[1]); state.month = Number(m[2]);
      if (state.view === 'week') { ensureWeek(); syncHash(true); }
      load();
      return;
    }
    syncHash(true);
  });

  // ── Data ──
  function bucket(data, ymPrefix) {
    var byDay = {};
    function push(ymd, kind, item) {
      if (ymPrefix && ymd.indexOf(ymPrefix) !== 0) return;
      if (!byDay[ymd]) byDay[ymd] = EMPTY_DAY();
      byDay[ymd][kind].push(item);
    }
    (data.events || []).forEach(function (ev) {
      var d = new Date(ev.date);
      if (isNaN(d)) return;
      push(ymdOf(d), 'events', ev);
    });
    (data.activities || []).forEach(function (a) {
      var d = new Date(a.date);
      if (isNaN(d)) return;
      push(ymdOf(d), 'activities', a);
    });
    (data.plans || []).forEach(function (p) {
      push(String(p.date || ''), 'plans', p);
    });
    Object.keys(byDay).forEach(function (k) {
      byDay[k].events.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
    });
    return byDay;
  }

  // Title: "September 2026" in month/agenda; the week's range in week view.
  function updateLabel() {
    if (state.view === 'week' && state.weekStart) {
      var ws = parseLocalYmd(state.weekStart);
      var we = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + 6);
      var md = function (d) { return d.getDate() + ' ' + d.toLocaleDateString('en-GB', { month: 'short' }); };
      if (ws.getFullYear() !== we.getFullYear()) {
        monthLabel.textContent = md(ws) + ' ' + ws.getFullYear() + ' – ' + md(we) + ' ' + we.getFullYear();
      } else if (ws.getMonth() !== we.getMonth()) {
        monthLabel.textContent = md(ws) + ' – ' + md(we) + ' ' + we.getFullYear();
      } else {
        monthLabel.textContent = ws.getDate() + '–' + we.getDate() + ' ' +
          we.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
      }
      return;
    }
    monthLabel.textContent = parseLocalYmd(currentYm() + '-01')
      .toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  }

  function skeleton() {
    var tiles = '';
    for (var i = 0; i < 5; i++) {
      tiles += '<div class="cs-tile" aria-hidden="true"><div class="cs-icon sk"></div><div class="cs-text" style="flex:1"><div class="sk" style="height:10px;width:60%"></div><div class="sk" style="height:18px;width:45%;margin-top:6px"></div></div></div>';
    }
    statsEl.innerHTML = tiles;
    statsEl.setAttribute('aria-busy', 'true');
    var cells = '';
    for (var j = 0; j < 35; j++) cells += '<div class="cal-day cd-empty sk" style="border:none"></div>';
    root.innerHTML = '<div role="status" aria-label="Loading calendar"><div class="cal-grid" style="padding-top:22px">' + cells + '</div></div>';
  }
  function showLoadError() {
    statsEl.innerHTML = '';
    statsEl.removeAttribute('aria-busy');
    root.innerHTML = '<div class="empty-state">The calendar could not be loaded right now.<div class="dp-act-row"><button class="dp-btn primary" id="cal-retry">Try again</button></div></div>';
    document.getElementById('cal-retry').addEventListener('click', load);
  }
  function applyData(data) {
    state.data = data;
    state.byDay = bucket(data, currentYm() + '-');
    state.byDayWide = bucket(data, null);
  }
  function load() {
    updateLabel();
    skeleton();
    var ym = currentYm();
    fetch(window.BASE + '/api/calendar/month?month=' + ym, { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (ym !== currentYm()) return; // a newer navigation superseded this load
        if (!data) { showLoadError(); return; }
        applyData(data);
        render();
      })
      .catch(function () { if (ym === currentYm()) showLoadError(); });
  }
  // In-place update after any panel action: server is the source of truth.
  function refresh() {
    fetch(window.BASE + '/api/calendar/month?month=' + currentYm(), { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) return;
        applyData(data);
        render();
      })
      .catch(function () {});
  }

  // ── Stats row (server-computed for the DISPLAYED month, account timezone) ──
  function renderStats() {
    statsEl.removeAttribute('aria-busy');
    var s = (state.data && state.data.stats) || {};
    var n = nowLocal();
    var isCurrent = currentYm() === (n.getFullYear() + '-' + pad2(n.getMonth() + 1));
    var monthShort = parseLocalYmd(currentYm() + '-01').toLocaleDateString('en-US', { month: 'long' });
    var period = isCurrent ? 'this month' : 'in ' + monthShort;
    var tiles = [
      { ic: '👟', bg: '#ECFDF5', label: 'Workouts', val: String(Number(s.sessions) || 0), sub: period },
      { ic: '⏱️', bg: '#F5F3FF', label: 'Total time', val: fmtMinutes((Number(s.hours) || 0) * 60), sub: period },
      { ic: '📍', bg: '#EFF6FF', label: 'Total distance', val: (Math.round((Number(s.distanceKm) || 0) * 10) / 10).toFixed(1) + ' <small>km</small>', sub: period },
      { ic: '🔥', bg: '#FFF7ED', label: 'Active days', val: String(Number(s.activeDays) || 0) + ' <small>of ' + (Number(s.observedDays) || 0) + '</small>', sub: 'days so far' },
      { ic: '🌙', bg: '#F3F4F6', label: 'Rest days', val: String(Number(s.restDays) || 0), sub: period }
    ];
    if (!isCurrent) tiles[3].sub = period;
    statsEl.innerHTML = tiles.map(function (t) {
      return '<div class="cs-tile"><div class="cs-icon" style="background:' + t.bg + '" aria-hidden="true">' + t.ic + '</div>' +
        '<div class="cs-text"><span class="cs-label">' + t.label + '</span><span class="cs-val">' + t.val + '</span><span class="cs-sub">' + t.sub + '</span></div></div>';
    }).join('');
  }

  // ── Shared formatting ──
  function timeOf(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }
  function activityLine2(a) {
    return [fmtKm(a.distanceKm), a.durationMinutes ? fmtMinutes(a.durationMinutes) : null].filter(Boolean).join(' · ');
  }

  // ── Pill component (month cells + week + agenda) ──
  function pillHtml(cls, style, icon, title, line2, lg, ariaExtra) {
    return '<span class="cp ' + cls + (lg ? ' cp-lg' : '') + '"' + (style ? ' style="' + style + '"' : '') +
      ' title="' + esc(title + (line2 ? ' — ' + line2 : '') + (ariaExtra ? ' (' + ariaExtra + ')' : '')) + '">' +
      '<span class="cp-l1"><span class="cp-ic" aria-hidden="true">' + icon + '</span><span class="cp-t">' + esc(title) + '</span></span>' +
      (line2 ? '<span class="cp-l2">' + esc(line2) + '</span>' : '') + '</span>';
  }
  function eventPill(ev, lg) {
    var line2 = [timeOf(ev.date), ev.club_name || null].filter(Boolean).join(' · ');
    return pillHtml(ev.myStatus === 'none' ? 'ev nr' : 'ev', '', sportIcon(ev.sport), ev.title || 'Event', line2, lg,
      ev.myStatus === 'none' ? 'not responded' : ev.myStatus);
  }
  function planPill(p, lg) {
    var title = p.title || sportName(p.sport);
    var icon = p.status === 'done' ? '✓' : sportIcon(p.sport);
    return pillHtml('plan ' + esc(p.status || 'planned'), '', icon, title, p.planned_duration || '', lg,
      p.status === 'done' ? 'plan done' : p.status === 'skipped' ? 'plan skipped' : 'planned');
  }
  function activityPill(a, lg) {
    return pillHtml('act', sportVars(a.sport), sportIcon(a.sport), a.title || sportName(a.sport), activityLine2(a), lg, 'logged');
  }
  function dayPills(day, lg) {
    var out = [];
    day.events.forEach(function (ev) { out.push(eventPill(ev, lg)); });
    day.plans.forEach(function (p) { out.push(planPill(p, lg)); });
    day.activities.forEach(function (a) { out.push(activityPill(a, lg)); });
    return out;
  }
  function dayAria(ymd, day) {
    var n = day.events.length + day.plans.length + day.activities.length;
    var label = parseLocalYmd(ymd).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    if (ymd === todayYmd()) label += ', today';
    return label + ', ' + (n ? n + ' item' + (n === 1 ? '' : 's') : 'nothing scheduled');
  }

  // ── MONTH GRID ──
  function renderMonth() {
    var y = state.year, m = state.month;
    var first = new Date(y, m - 1, 1);
    var daysInMonth = new Date(y, m, 0).getDate();
    var lead = (first.getDay() + 6) % 7;
    var today = todayYmd();
    var html = '<div class="cal-labels" aria-hidden="true"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>';
    html += '<div class="cal-grid">';
    for (var i = 0; i < lead; i++) html += '<div class="cal-day cd-empty" aria-hidden="true"></div>';
    for (var d = 1; d <= daysInMonth; d++) {
      var ymd = y + '-' + pad2(m) + '-' + pad2(d);
      var day = state.byDay[ymd] || EMPTY_DAY();
      var cls = 'cal-day' + (ymd === today ? ' cd-today' : '');
      html += '<div class="' + cls + '" data-ymd="' + ymd + '" role="button" tabindex="0" aria-label="' + esc(dayAria(ymd, day)) + '">';
      html += '<span class="cd-num" aria-hidden="true">' + d + '</span>';
      var pills = dayPills(day, false);
      if (pills.length) {
        html += '<span class="cd-pills" aria-hidden="true">' + pills.slice(0, 5).join('') +
          (pills.length > 5 ? '<span class="cd-more">+' + (pills.length - 5) + ' more</span>' : '') + '</span>';
      }
      // Mobile (≤768px): dots per content type.
      var dots = '';
      if (day.events.some(function (ev) { return ev.myStatus !== 'none'; })) dots += '<span class="cd-dot ev"></span>';
      if (day.events.some(function (ev) { return ev.myStatus === 'none'; })) dots += '<span class="cd-dot nr"></span>';
      if (day.plans.length) dots += '<span class="cd-dot plan"></span>';
      var seen = {};
      day.activities.forEach(function (a) {
        if (seen[a.sport]) return; seen[a.sport] = 1;
        dots += '<span class="cd-dot act" style="background:' + esc(sportColors(a.sport).text) + '"></span>';
      });
      if (dots) html += '<span class="cd-dots" aria-hidden="true">' + dots + '</span>';
      html += '</div>';
    }
    html += '</div>';
    root.innerHTML = html;
    wireDayTargets('.cal-day[data-ymd]');
  }
  function wireDayTargets(sel) {
    root.querySelectorAll(sel).forEach(function (el) {
      el.addEventListener('click', function () { openDayPanel(el.getAttribute('data-ymd'), el); });
      el.addEventListener('keydown', function (e) {
        if (e.target !== el) return;
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDayPanel(el.getAttribute('data-ymd'), el); }
        // Arrow keys move focus across the month grid (7-column spatial nav).
        if (el.classList.contains('cal-day')) {
          var step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
          if (step) {
            var target = root.querySelector('.cal-day[data-ymd="' + ymdAddDays(el.getAttribute('data-ymd'), step) + '"]');
            if (target) { e.preventDefault(); target.focus(); }
          }
        }
      });
    });
    markSelection();
  }

  // ── WEEK + AGENDA (same pills, day cards) ──
  function dayCardHtml(ymd, day, isWeek) {
    var today = todayYmd();
    var label = parseLocalYmd(ymd).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    var pills = dayPills(day, true);
    var html = '<div class="ag-day wk-day' + (ymd === today ? ' today' : '') + '" data-ymd="' + ymd + '"' + (ymd === today && !isWeek ? ' id="ag-today"' : '') +
      ' role="button" tabindex="0" aria-label="' + esc(dayAria(ymd, day)) + '">';
    html += '<div class="ag-head" aria-hidden="true"><span class="ag-date">' + label + '</span>' +
      (ymd === today ? '<span class="ag-today-tag">Today</span>' : '') + '</div>';
    html += pills.length
      ? '<div class="ag-pills" aria-hidden="true">' + pills.join('') + '</div>'
      : '<div class="wk-rest" aria-hidden="true">Nothing scheduled</div>';
    return html + '</div>';
  }
  function renderAgenda() {
    var days = Object.keys(state.byDay).sort();
    if (!days.length) {
      root.innerHTML = '<div class="empty-state"><div style="font-size:26px;margin-bottom:6px" aria-hidden="true">🗓️</div>Nothing on the calendar this month yet.<br>RSVP to an event, plan a session or log an activity and it shows up here.' +
        '<div class="dp-act-row"><button class="dp-btn primary" data-root-add="log">➕ Log activity</button><button class="dp-btn" data-root-add="plan">🗓️ Plan a session</button></div></div>';
      return;
    }
    root.innerHTML = '<div class="agenda">' + days.map(function (ymd) { return dayCardHtml(ymd, state.byDay[ymd], false); }).join('') + '</div>';
    wireDayTargets('.wk-day');
    var todayEl = document.getElementById('ag-today');
    if (todayEl && typeof todayEl.scrollIntoView === 'function' && !docked()) {
      todayEl.scrollIntoView({ block: 'start', behavior: 'auto' });
    }
  }
  function renderWeek() {
    var ws = parseLocalYmd(state.weekStart);
    var html = '<div class="agenda">';
    for (var i = 0; i < 7; i++) {
      var ymd = ymdOf(new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + i));
      html += dayCardHtml(ymd, state.byDayWide[ymd] || EMPTY_DAY(), true);
    }
    root.innerHTML = html + '</div>';
    wireDayTargets('.wk-day');
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-root-add]') : null;
    if (b) doAdd(b.getAttribute('data-root-add'));
  });

  // ── Selection ──
  function visibleRange() {
    if (state.view === 'week' && state.weekStart) return [state.weekStart, ymdAddDays(state.weekStart, 6)];
    var last = new Date(state.year, state.month, 0).getDate();
    return [currentYm() + '-01', currentYm() + '-' + pad2(last)];
  }
  function inRange(ymd) { var r = visibleRange(); return ymd >= r[0] && ymd <= r[1]; }
  function ensureSelection() {
    if (!docked()) return;
    if (state.openYmd && inRange(state.openYmd)) return;
    var t = todayYmd();
    state.openYmd = inRange(t) ? t : visibleRange()[0];
    panelForm = null; panelDeleteId = null;
  }
  function markSelection() {
    root.querySelectorAll('[data-ymd]').forEach(function (el) {
      var on = el.getAttribute('data-ymd') === state.openYmd && (docked() || panelWrap.classList.contains('open'));
      el.classList.toggle('is-sel', on);
      el.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  function selectedOrToday() { return state.openYmd || todayYmd(); }

  function render() {
    if (!state.data) return;
    ensureSelection();
    if (state.view === 'agenda') renderAgenda();
    else if (state.view === 'week') renderWeek();
    else renderMonth();
    renderStats();
    updateAddMenu();
    if (state.openYmd) renderDayPanel();
  }

  // ── DAY PANEL ──
  function eventChip(ev) {
    if (ev.myStatus === 'going') return '<span class="chip going">Going</span>';
    if (ev.myStatus === 'interested') return '<span class="chip interested">Interested</span>';
    return '<span class="chip nr">Not responded</span>';
  }
  function planChip(p) {
    if (p.status === 'done') return '<span class="chip done">✓ Done</span>';
    if (p.status === 'skipped') return '<span class="chip skipped">Skipped</span>';
    return '<span class="chip planned">Planned</span>';
  }
  function rsvpBtn(evId, status, label, extraCls) {
    return '<button class="dp-btn' + (extraCls ? ' ' + extraCls : '') + '" data-cal-action="rsvp" data-id="' + esc(evId) + '" data-status="' + status + '">' + label + '</button>';
  }
  function eventActionsHtml(ev) {
    var btns = [];
    if (ev.myStatus === 'going') {
      btns.push(rsvpBtn(ev.id, 'interested', 'Switch to interested'));
      btns.push(rsvpBtn(ev.id, 'cancelled', 'Cancel RSVP', 'danger'));
    } else if (ev.myStatus === 'interested') {
      btns.push(rsvpBtn(ev.id, 'going', "I'm going", 'primary'));
      btns.push(rsvpBtn(ev.id, 'cancelled', 'Cancel RSVP', 'danger'));

      btns.push(rsvpBtn(ev.id, 'going', "I'm going", 'primary'));
      btns.push(rsvpBtn(ev.id, 'interested', 'Interested'));

    if (panelDeleteId === p.id) {
      return '<div class="dp-act-row" style="align-items:center">' +
        '<span class="ag-meta">Delete:</span>' +
        '<button class="dp-btn danger" data-cal-action="plan-delete-one" data-id="' + esc(p.id) + '">Just this session</button>' +
        '<button class="dp-btn danger" data-cal-action="plan-delete-future" data-id="' + esc(p.id) + '">This + all future</button>' +

      btns.push('<button class="dp-btn primary" data-cal-action="plan-log" data-id="' + esc(p.id) + '">Log this</button>');

  function activityCardHtml(a) {
    var stats = [];
    var km = fmtKm(a.distanceKm);

    if (a.durationMinutes) stats.push('<div class="dc-stat"><b>' + esc(fmtMinutes(a.durationMinutes)) + '</b><span>Duration</span></div>');
    if (a.feeling) stats.push('<div class="dc-stat"><b>' + (FEELING_EMOJI[a.feeling] ? FEELING_EMOJI[a.feeling] + ' ' : '') + esc(feelingLabel(a.feeling)) + '</b><span>Feeling</span></div>');
    return '<article class="dp-card act" style="' + sportVars(a.sport) + '">' +
      '<div class="dc-top"><div class="dc-ic" aria-hidden="true">' + sportIcon(a.sport) + '</div>' +
      '<div class="dc-main"><div class="dc-title">' + esc(a.title || sportName(a.sport)) + '</div>' +
      '<div class="dc-sub">' + esc(sportName(a.sport)) + (timeOf(a.date) ? ' · ' + esc(timeOf(a.date)) : '') + '</div></div></div>' +
      (stats.length ? '<div class="dc-stats">' + stats.join('') + '</div>' : '') +
      (a.notes ? '<div class="dc-notes"><span class="dc-notes-l">Notes</span>' + esc(a.notes) + '</div>' : '') +
      '</article>';
  }
  function planCardHtml(p) {
    var meta = [esc(sportName(p.sport)), p.planned_duration ? esc(p.planned_duration) : null].filter(Boolean).join(' · ');
    return '<article class="dp-card plan ' + esc(p.status || 'planned') + '">' +
      '<div class="dc-top"><div class="dc-ic" style="--pbg:#F5F3FF;--ptx:#5B21B6" aria-hidden="true">' + (p.status === 'done' ? '✓' : sportIcon(p.sport)) + '</div>' +
      '<div class="dc-main"><div class="dc-title">' + esc(p.title || ('Planned ' + sportName(p.sport).toLowerCase())) +
      (p.series_id ? ' <span title="Repeats" aria-label="Part of a repeating series" style="color:var(--gray-500);font-weight:400">\u21bb</span>' : '') + '</div>' +
      (meta ? '<div class="dc-sub">' + meta + '</div>' : '') + '</div>' + planChip(p) + '</div>' +
      (p.notes ? '<div class="dc-meta">' + esc(p.notes) + '</div>' : '') +
      planActionsHtml(p) + '</article>';
  }
  function eventCardHtml(ev) {
    var thumb = ev.image
      ? '<img src="' + esc(window.BASE + '/api/events/' + encodeURIComponent(ev.id) + '/image?v=' + encodeURIComponent(ev.image)) + '" alt="" style="width:36px;height:36px;border-radius:9px;object-fit:cover;flex-shrink:0">'
      : '<div class="dc-ic" style="--pbg:var(--yellow-light);--ptx:#6B5000" aria-hidden="true">' + sportIcon(ev.sport) + '</div>';
    var meta = [timeOf(ev.date) ? '🕒 ' + esc(timeOf(ev.date)) : null, ev.club_name ? '🏟️ ' + esc(ev.club_name) : null, ev.location ? '📍 ' + esc(ev.location) : null]
      .filter(Boolean).join(' · ');
    return '<article class="dp-card ev' + (ev.myStatus === 'none' ? ' nr' : '') + '">' +
      '<div class="dc-top">' + thumb +
      '<div class="dc-main event-text"><div class="dc-title event-text">' + esc(ev.title || 'Event') + '</div></div>' + eventChip(ev) + '</div>' +
      (meta ? '<div class="dc-meta event-text">' + meta + '</div>' : '') +
      eventActionsHtml(ev) +
      '<a class="dc-openlink" href="' + esc(window.BASE + '/events?event=' + encodeURIComponent(ev.id)) + '" aria-label="View event: ' + esc(ev.title || 'Event') + '">View event →</a>' +
      '</article>';
  }

  // Compact plan create/edit form (unchanged behaviour).
  function planFormHtml() {
    var editing = null;
    if (panelForm && panelForm.mode === 'edit') {
      var day = state.byDayWide[state.openYmd] || { plans: [] };
      day.plans.forEach(function (p) { if (p.id === panelForm.planId) editing = p; });
      if (!editing) return '';
    }
    var reg = window.ARENAS_SPORTS || [];
    var selSport = editing ? editing.sport : (reg[0] ? reg[0].id : '');
    var opts = reg.map(function (s) {
      return '<option value="' + esc(s.id) + '"' + (s.id === selSport ? ' selected' : '') + '>' +
        esc(s.emoji + ' ' + s.label) + '</option>';
    }).join('');
    var repeatCtl = '';
    if (!editing) {
      repeatCtl =
        '<div class="fi"><label for="dpf-repeat">Repeats</label><select id="dpf-repeat">' +
        '<option value="none" selected>Does not repeat</option>' +
        '<option value="daily">Every day</option>' +
        '<option value="weekly">Every week</option>' +
        '<option value="biweekly">Every 2 weeks</option>' +
        '</select></div>' +
        '<div id="dpf-repeat-more" style="display:none">' +
        '<div class="fi"><label for="dpf-until">Until</label><input type="date" id="dpf-until"></div>' +
        '<div id="dpf-repeat-summary" class="ag-meta" style="margin:-4px 0 10px"></div>' +
        '</div>';
    } else if (editing.series) {
      repeatCtl = '<div class="ag-meta" style="margin:-2px 0 10px">↻ Part of a series — ' + esc(seriesLabel(editing.series)) + '. Changing the date takes this session out of the series.</div>';
    }
    return '<div class="dp-form">' +
      '<div class="dp-form-err" id="dpf-err" role="alert"></div>' +
      '<div class="fi"><label for="dpf-date">Date</label><input type="date" id="dpf-date" value="' + esc(editing ? editing.date : state.openYmd) + '"></div>' +
      repeatCtl +
      '<div class="fi"><label for="dpf-sport">Sport</label><select id="dpf-sport">' + opts + '</select></div>' +
      '<div class="fi"><label for="dpf-title">Title <span class="opt">(optional)</span></label><input type="text" id="dpf-title" maxlength="120" placeholder="e.g. Tempo intervals" value="' + esc((editing && editing.title) || '') + '"></div>' +
      '<div class="fi"><label for="dpf-duration">Planned duration <span class="opt">(optional)</span></label><input type="text" id="dpf-duration" maxlength="20" placeholder="e.g. 45:00 or 1h 20m" value="' + esc((editing && editing.planned_duration) || '') + '"></div>' +
      '<div class="fi"><label for="dpf-notes">Notes <span class="opt">(optional)</span></label><textarea id="dpf-notes" maxlength="500" rows="2" placeholder="Focus, route, workout details…">' + esc((editing && editing.notes) || '') + '</textarea></div>' +
      '<div class="dp-act-row" style="margin-top:2px">' +
      '<button class="dp-btn primary" data-cal-action="plan-save">' + (editing ? 'Save changes' : 'Add plan') + '</button>' +
      '<button class="dp-btn" data-cal-action="plan-cancel-form">Cancel</button>' +
      '</div></div>';
  }

  function weekdayNameOf(ymd) { return parseLocalYmd(ymd).toLocaleDateString('en-GB', { weekday: 'long' }); }
  function fmtLongDate(ymd) { return parseLocalYmd(ymd).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
  function seriesLabel(s) {
    var when = s.frequency === 'daily' ? 'every day'
      : s.frequency === 'weekly' ? 'every ' + weekdayNameOf(s.start_date)
      : 'every other ' + weekdayNameOf(s.start_date);
    return when + ' through ' + fmtLongDate(s.end_date);
  }
  function countOccurrences(startYmd, frequency, untilYmd) {
    var step = frequency === 'daily' ? 1 : frequency === 'weekly' ? 7 : 14;
    var n = 0;
    for (var d = startYmd; d <= untilYmd; d = ymdAddDays(d, step)) { n++; if (n > 100) break; }
    return n;
  }
  function updateRepeatUI() {
    var repEl = document.getElementById('dpf-repeat');
    var moreEl = document.getElementById('dpf-repeat-more');
    if (!repEl || !moreEl) return;
    var rep = repEl.value;
    if (rep === 'none') { moreEl.style.display = 'none'; return; }
    moreEl.style.display = '';
    var untilEl = document.getElementById('dpf-until');
    var date = (document.getElementById('dpf-date').value || '').trim();
    if (untilEl && !untilEl.value && date) untilEl.value = ymdAddDays(date, 56);
    var until = untilEl ? (untilEl.value || '').trim() : '';
    var sumEl = document.getElementById('dpf-repeat-summary');
    if (!sumEl) return;
    if (!date || !until) { sumEl.textContent = 'Pick an end date to see how many sessions this creates.'; return; }
    if (until <= date) { sumEl.textContent = 'The end date must be after the first session.'; return; }
    var n = countOccurrences(date, rep, until);
    if (n > 100) { sumEl.textContent = 'That would create more than 100 sessions — shorten the end date.'; return; }
    var when = rep === 'daily' ? 'every day'
      : rep === 'weekly' ? 'every ' + weekdayNameOf(date)
      : 'every other ' + weekdayNameOf(date);
    sumEl.textContent = 'Creates ' + n + ' session' + (n !== 1 ? 's' : '') + ' — ' + when + ' through ' + fmtLongDate(until) + '.';
  }

  function planCreateAffordance() {
    if (panelForm && panelForm.mode === 'create') return planFormHtml();
    if (proLocked) return '<div class="dp-act-row"><button class="dp-btn primary" data-cal-action="upgrade">🔒 Upgrade to Pro →</button></div>';
    return '<div class="dp-act-row"><button class="dp-btn" data-cal-action="plan-new">+ Plan a session</button></div>';
  }
  function renderDayPanel() {
    var ymd = state.openYmd;
    if (!ymd) return;
    var day = state.byDayWide[ymd] || EMPTY_DAY();
    var isToday = ymd === todayYmd();
    document.getElementById('dp-title').textContent =
      parseLocalYmd(ymd).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    var html = '';
    var empty = !day.events.length && !day.plans.length && !day.activities.length;
    if (empty && !panelForm) {
      html = '<div class="dp-nothing"><div class="dp-nothing-ic" aria-hidden="true">🌤️</div>' +
        '<div class="dp-nothing-t">Nothing on this day</div>' +
        '<div class="dp-nothing-s">' + (ymd > todayYmd() ? 'Plan a session ahead, or log one once it’s done.' : 'Log what you did, or plan something for this day.') + '</div>' +
        '<div class="dp-act-row">' +
        '<button class="dp-btn primary" data-cal-action="add-log">➕ Log activity</button>' +
        (proLocked
          ? '<button class="dp-btn" data-cal-action="upgrade">🔒 Plan a session (Pro)</button>'
          : '<button class="dp-btn" data-cal-action="plan-new">🗓️ Plan a session</button>') +
        '</div></div>';
    } else {
      html += '<section class="dp-section" aria-labelledby="dps-act"><div class="dp-section-head"><h3 class="dp-section-label" id="dps-act">Activities</h3></div>';
      html += day.activities.length
        ? day.activities.map(activityCardHtml).join('')
        : '<div class="dp-empty">No logged activities.</div>';
      html += '</section>';
      html += '<section class="dp-section" aria-labelledby="dps-plan"><div class="dp-section-head"><h3 class="dp-section-label" id="dps-plan">' + (isToday ? 'Today’s plan' : 'Plan for this day') + '</h3>' +
        '<button class="dp-link" data-cal-action="view-plans">View all plans</button></div>';
      html += day.plans.length
        ? day.plans.map(function (p) {
            if (panelForm && panelForm.mode === 'edit' && panelForm.planId === p.id) return planFormHtml();
            return planCardHtml(p);
          }).join('')
        : '<div class="dp-empty">No planned sessions.</div>';
      html += planCreateAffordance();
      html += '</section>';
      html += '<section class="dp-section" aria-labelledby="dps-ev"><div class="dp-section-head"><h3 class="dp-section-label" id="dps-ev">Events</h3></div>';
      html += day.events.length
        ? day.events.map(eventCardHtml).join('')
        : '<div class="dp-empty">No events on this day.</div>';
      html += '</section>';
    }
    document.getElementById('dp-body').innerHTML = html;
    markSelection();
  }

  function applyPanelMode() {
    if (docked()) {
      panelWrap.classList.remove('open');
      panelSheet.setAttribute('role', 'complementary');
      panelSheet.setAttribute('aria-labelledby', 'dp-title');
      panelSheet.removeAttribute('aria-modal');
    } else {
      panelSheet.setAttribute('role', 'dialog');
      panelSheet.setAttribute('aria-modal', 'true');
      panelSheet.setAttribute('aria-labelledby', 'dp-title');
    }
  }
  window.openDayPanel = function (ymd, trigger) {
    state.openYmd = ymd;
    panelForm = null; panelDeleteId = null;
    renderDayPanel();
    updateAddMenu();
    if (!docked()) {
      sheetReturnFocus = trigger || document.activeElement;
      panelWrap.classList.add('open');
      markSelection();
      document.getElementById('dp-close').focus();
    }
  };
  window.closeDayPanel = function () {
    if (docked()) return; // the docked panel is permanent
    if (!panelWrap.classList.contains('open')) return;
    state.openYmd = null;
    panelForm = null;
    panelWrap.classList.remove('open');
    markSelection();
    updateAddMenu();
    if (sheetReturnFocus && document.body.contains(sheetReturnFocus)) sheetReturnFocus.focus();
    sheetReturnFocus = null;
  };
  panelWrap.addEventListener('click', function (e) { if (e.target === panelWrap) closeDayPanel(); });
  document.getElementById('dp-close').addEventListener('click', function () { closeDayPanel(); });
  // Sheet focus trap (≤1024px only).
  panelWrap.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab' || docked() || !panelWrap.classList.contains('open')) return;
    var f = panelSheet.querySelectorAll('button:not([disabled]), a[href], input, select, textarea');
    var vis = Array.prototype.filter.call(f, function (el) { return el.offsetParent !== null; });
    if (!vis.length) return;
    if (e.shiftKey && document.activeElement === vis[0]) { e.preventDefault(); vis[vis.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === vis[vis.length - 1]) { e.preventDefault(); vis[0].focus(); }
  });

  // Prev/next day: moves the visible month/week along when the day leaves it.
  function stepDay(delta) {
    var n = ymdAddDays(state.openYmd || todayYmd(), delta);
    state.openYmd = n;
    panelForm = null; panelDeleteId = null;
    if (inRange(n)) { renderDayPanel(); updateAddMenu(); return; }
    var d = parseLocalYmd(n);
    if (state.view === 'week') {
      var ws = mondayOf(d);
      state.weekStart = ymdOf(ws);
      if (ws.getFullYear() !== state.year || ws.getMonth() + 1 !== state.month) {
        state.year = ws.getFullYear(); state.month = ws.getMonth() + 1;
        syncHash(); load();
      } else { syncHash(); updateLabel(); render(); }
    } else {
      state.year = d.getFullYear(); state.month = d.getMonth() + 1;
      syncHash(); load();
    }
  }
  document.getElementById('dp-prev').addEventListener('click', function () { stepDay(-1); });
  document.getElementById('dp-next').addEventListener('click', function () { stepDay(1); });

  dockMq.addEventListener ? dockMq.addEventListener('change', onDockChange) : dockMq.addListener(onDockChange);
  function onDockChange() {
    applyPanelMode();
    if (!docked()) { state.openYmd = null; panelForm = null; }
    render();
  }

  // ── + Add dropdown ──
  var addBtn = document.getElementById('add-btn');
  var addMenu = document.getElementById('add-menu');
  function addItems() { return Array.prototype.slice.call(addMenu.querySelectorAll('[role="menuitem"]')); }
  function shortDate(ymd) { return parseLocalYmd(ymd).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
  function updateAddMenu() {
    var ymd = selectedOrToday();
    var lbl = ymd === todayYmd() ? 'For today' : 'For ' + shortDate(ymd);
    document.getElementById('am-log-sub').textContent = lbl;
    document.getElementById('am-plan-sub').textContent = proLocked ? 'Pro feature' : lbl;
  }
  function openAddMenu(focusIdx) {
    updateAddMenu();
    addMenu.classList.add('open');
    addBtn.setAttribute('aria-expanded', 'true');
    var items = addItems();
    (items[focusIdx] || items[0]).focus();
  }
  function closeAddMenu(returnFocus) {
    if (!addMenu.classList.contains('open')) return;
    addMenu.classList.remove('open');
    addBtn.setAttribute('aria-expanded', 'false');
    if (returnFocus) addBtn.focus();
  }
  addBtn.addEventListener('click', function () {
    if (addMenu.classList.contains('open')) closeAddMenu(false); else openAddMenu(0);
  });
  addBtn.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); openAddMenu(0); }
    if (e.key === 'ArrowUp') { e.preventDefault(); openAddMenu(2); }
  });
  addMenu.addEventListener('keydown', function (e) {
    var items = addItems();
    var i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
    else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeAddMenu(true); }
    else if (e.key === 'Tab') closeAddMenu(false);
  });
  addMenu.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-add]') : null;
    if (!b) return;
    closeAddMenu(false);
    doAdd(b.getAttribute('data-add'));
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest('.add-wrap')) closeAddMenu(false);
  });
  function doAdd(kind) {
    var ymd = selectedOrToday();
    if (kind === 'log') { window.location.href = window.BASE + '/log?date=' + encodeURIComponent(ymd); return; }
    if (kind === 'event') { window.location.href = window.BASE + '/events'; return; }
    if (kind === 'plan') {
      if (proLocked) { toast('Planning sessions is a Pro feature — upgrade from your Billing page.'); }
      openDayPanel(ymd, addBtn);
      if (!proLocked) {
        panelForm = { mode: 'create' };
        renderDayPanel();
        var f = document.getElementById('dpf-date');
        if (f) f.focus();
      }
    }
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (addMenu.classList.contains('open')) closeAddMenu(true); else closeDayPanel(); }
  });

  // ── Panel actions (one delegated handler; buttons carry data-cal-action) ──
  function patchPlanStatus(id, status, btn) {
    btn.disabled = true;
    api('PATCH', '/api/plans/' + encodeURIComponent(id), { status: status }).then(function (r) {
      if (!r.ok || r.json.error) { toast(errText(r)); btn.disabled = false; return; }
      toast(status === 'done' ? '✓ Marked done' : 'Marked skipped');
      refresh();
    }).catch(function () { toast('Something went wrong — please try again.'); btn.disabled = false; });
  }
  function deletePlan(id, btn, future) {
    if (panelDeleteId !== id && !window.confirm('Delete this planned session? This cannot be undone.')) return;
    btn.disabled = true;
    api('DELETE', '/api/plans/' + encodeURIComponent(id) + (future ? '?scope=future' : '')).then(function (r) {
      if (!r.ok || r.json.error) { toast(errText(r)); btn.disabled = false; return; }
      panelDeleteId = null;
      toast(future && r.json.deleted > 1 ? r.json.deleted + ' planned sessions deleted' : 'Plan deleted');
      refresh();
    }).catch(function () { toast('Something went wrong — please try again.'); btn.disabled = false; });
  }
  function submitPlanForm(btn) {
    var err = document.getElementById('dpf-err');
    var date = (document.getElementById('dpf-date').value || '').trim();
    var sport = document.getElementById('dpf-sport').value;
    var title = document.getElementById('dpf-title').value.trim();
    var duration = document.getElementById('dpf-duration').value.trim();
    var notes = document.getElementById('dpf-notes').value.trim();
    function fail(msg) { err.textContent = msg; err.style.display = 'block'; }
    if (!date) return fail('Please pick a date.');
    if (!sport) return fail('Please pick a sport.');
    var wasEdit = panelForm && panelForm.mode === 'edit';
    var body = { date: date, sport: sport, title: title || null, planned_duration: duration || null, notes: notes || null };
    var repEl = document.getElementById('dpf-repeat');
    var rep = (!wasEdit && repEl) ? repEl.value : 'none';
    var recurring = rep !== 'none';
    if (recurring) {
      var until = (document.getElementById('dpf-until').value || '').trim();
      if (!until) return fail('Pick an end date for the repeating plan.');
      if (until <= date) return fail('The end date must be after the first session.');
      if (countOccurrences(date, rep, until) > 100) return fail('That would create more than 100 sessions — shorten the end date.');
      body.recurrence = { frequency: rep, until: until };
    }
    btn.disabled = true; btn.textContent = 'Saving…';
    var req = wasEdit
      ? api('PATCH', '/api/plans/' + encodeURIComponent(panelForm.planId), body)
      : api('POST', '/api/plans', body);
    req.then(function (r) {
      if (!r.ok || r.json.error) {
        fail(errText(r));
        btn.disabled = false; btn.textContent = wasEdit ? 'Save changes' : 'Add plan';
        return;
      }
      panelForm = null;
      if (recurring && r.json.count) {
        var s = r.json.series || {};
        toast('✓ ' + r.json.count + ' sessions planned — ' + (s.end_date ? seriesLabel({ frequency: rep, start_date: date, end_date: s.end_date }) : 'series created') + '.');
      } else if (wasEdit && r.json.detached) {
        toast('✓ Saved — the new date takes this session out of its series; series-wide deletes won\u2019t touch it.');
      } else {
        toast(wasEdit ? '✓ Plan updated' : '✓ Session planned');
      }
      refresh();
    }).catch(function () {
      fail('Something went wrong — please try again.');
      btn.disabled = false; btn.textContent = wasEdit ? 'Save changes' : 'Add plan';
    });
  }
  function rsvpFromPanel(eventId, status, btn) {
    btn.disabled = true;
    api('POST', '/api/events/' + encodeURIComponent(eventId) + '/rsvp', { status: status }).then(function (r) {
      if (!r.ok || r.json.error) { toast(errText(r)); btn.disabled = false; return; }
      toast(status === 'going' ? "✓ You're going!" : status === 'interested' ? '★ Marked interested' : 'RSVP removed');
      refresh();
    }).catch(function () { toast('Something went wrong — please try again.'); btn.disabled = false; });
  }

  ['change', 'input'].forEach(function (evt) {
    document.getElementById('dp-body').addEventListener(evt, function (e) {
      var id = e.target && e.target.id;
      if (id === 'dpf-repeat' || id === 'dpf-until' || id === 'dpf-date') updateRepeatUI();
    });
  });
  document.getElementById('dp-body').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-cal-action]') : null;
    if (!btn || btn.disabled) return;
    var act = btn.getAttribute('data-cal-action');
    var id = btn.getAttribute('data-id') || '';
    if (act === 'plan-new') {
      panelForm = { mode: 'create' }; panelDeleteId = null; renderDayPanel();
      var f = document.getElementById('dpf-date'); if (f) f.focus();
    }
    else if (act === 'plan-edit') { panelForm = { mode: 'edit', planId: id }; panelDeleteId = null; renderDayPanel(); }
    else if (act === 'plan-cancel-form') { panelForm = null; renderDayPanel(); }
    else if (act === 'plan-save') submitPlanForm(btn);
    else if (act === 'plan-done') patchPlanStatus(id, 'done', btn);
    else if (act === 'plan-skip') patchPlanStatus(id, 'skipped', btn);
    else if (act === 'plan-delete') {
      var day = state.byDayWide[state.openYmd] || { plans: [] };
      var target = null;
      day.plans.forEach(function (p) { if (p.id === id) target = p; });
      if (target && target.series_id) { panelDeleteId = id; renderDayPanel(); }
      else deletePlan(id, btn, false);
    }
    else if (act === 'plan-delete-one') deletePlan(id, btn, false);
    else if (act === 'plan-delete-future') deletePlan(id, btn, true);
    else if (act === 'plan-delete-cancel') { panelDeleteId = null; renderDayPanel(); }
    else if (act === 'plan-log') { window.location.href = window.BASE + '/log?plan=' + encodeURIComponent(id); }
    else if (act === 'rsvp') rsvpFromPanel(id, btn.getAttribute('data-status'), btn);
    else if (act === 'add-log') { window.location.href = window.BASE + '/log?date=' + encodeURIComponent(state.openYmd || todayYmd()); }
    else if (act === 'upgrade') { window.location.href = window.BASE + '/billing'; }
    else if (act === 'view-plans') {
      if (!docked()) closeDayPanel();
      setView('agenda');
    }
  });

  // ── Wire controls ──
  document.getElementById('cal-prev').addEventListener('click', function () { if (state.view === 'week') shiftWeek(-1); else shiftMonth(-1); });
  document.getElementById('cal-next').addEventListener('click', function () { if (state.view === 'week') shiftWeek(1); else shiftMonth(1); });
  document.getElementById('cal-today-btn').addEventListener('click', goToday);
  document.getElementById('vt-month').addEventListener('click', function () { setView('month'); });
  document.getElementById('vt-week').addEventListener('click', function () { setView('week'); });
  document.getElementById('vt-agenda').addEventListener('click', function () { setView('agenda'); });
  // Tablist arrow-key roving (keeps click behaviour identical).
  document.querySelector('.view-toggle').addEventListener('keydown', function (e) {
    var order = ['month', 'week', 'agenda'];
    var i = order.indexOf(state.view);
    var n = e.key === 'ArrowRight' ? (i + 1) % 3 : e.key === 'ArrowLeft' ? (i + 2) % 3 : -1;
    if (n < 0) return;
    e.preventDefault();
    setView(order[n]);
    document.getElementById('vt-' + order[n]).focus();
  });

  applyPanelMode();
  var hashForcedWeek = initFromHash();
  if (hashForcedWeek) { state.view = 'week'; } else { initView(); }
  if (state.view === 'week' && !state.weekStart) ensureWeek();
  renderToggle();
  syncHash(true);
  load();
})();
</script>
<script>
// Identity: swap placeholder initials/name for the logged-in viewer.
(function () {
  var data = window.ARENAS_DATA;
  if (!data || !data.profile) return;
  var p = data.profile;
  var name = p.name || 'Athlete';
  var initials = (name.trim().split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2) || 'A').toUpperCase();
  document.querySelectorAll('.user-initials').forEach(function (el) { el.textContent = initials; });
  document.querySelectorAll('.user-name').forEach(function (el) { el.textContent = name; });
})();
</script>
<script>
// Shared "My clubs" sidebar renderer — identical on every athlete-facing page so
// the sidebar always reflects the viewer's real club memberships
// (window.ARENAS_DATA.clubs) from the same Supabase query. No hardcoded club data
// lives in the static HTML.
(function () {
  var clubs = (window.ARENAS_DATA && window.ARENAS_DATA.clubs) || [];
  var label = null;
  document.querySelectorAll('.sidebar .nav-section-label').forEach(function (l) {
    if (/^\s*my clubs\s*$/i.test(l.textContent || '')) label = l;
  });
  if (!label) return;
  var parent = label.parentNode;
  var sib = label.nextElementSibling;
  while (sib && sib.classList && sib.classList.contains('nav-item')) {
    var next = sib.nextElementSibling;
    sib.remove();
    sib = next;
  }
  var anchor = label.nextElementSibling;
  var sportIcons = window.ARENAS_SPORT_ICONS || {}; // registry emoji + legacy drift entries
  if (!clubs.length) {
    var empty = document.createElement('div');
    empty.className = 'nav-item';
    empty.style.cssText = 'color:var(--gray-400)';
    empty.textContent = 'No clubs yet — find one';
    empty.onclick = function () { if (typeof nav === 'function') nav('/clubs'); };
    parent.insertBefore(empty, anchor);
  }
  clubs.forEach(function (club) {
    var item = document.createElement('div');
    item.className = 'nav-item';
    item.onclick = function () {
      if (typeof nav !== 'function') return;
      if (club.role === 'admin' || club.role === 'coach') { nav('/clubs/dashboard?club=' + club.id); }
      else { nav('/clubs/member/' + club.id); }
    };
    var ic = document.createElement('span');
    ic.className = 'nav-icon';
    if (club.logo_url && window.clubTileHtml) {
      ic.style.cssText = 'width:18px;height:18px;border-radius:4px;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle';
      ic.innerHTML = window.clubTileHtml.content(club.logo_url, club.sport);
    } else {
      ic.textContent = sportIcons[club.sport] || '🏟';
    }
    item.appendChild(ic);
    item.appendChild(document.createTextNode(' ' + (club.name || 'Club')));
    // Server-decided plan badge (club.plan comes from getClubPlan on the
    // sidebar-clubs data path; free clubs have no plan field, so their rows
    // carry zero badge markup — never client-guessed).
    if (club.plan === 'club_pro') {
      var pb = document.createElement('span');
      pb.className = 'pro-badge';
      pb.textContent = 'PRO';
      item.appendChild(pb);
    }
    parent.insertBefore(item, anchor);
  });
  // "+ Create club" entry point — always the LAST item in My clubs, including
  // the zero-clubs case (that's the primary audience). Opens the in-app
  // club-setup modal (arenas-club-create.js, shared submit layer with the
  // /for-clubs wizard); falls back to the session-aware /for-clubs wizard if
  // the module failed to load.
  var create = document.createElement('div');
  create.className = 'nav-item';
  create.onclick = function () { if (window.ArenasClubCreate) { window.ArenasClubCreate.open(); } else if (typeof nav === 'function') { nav('/for-clubs?create=1'); } };
  var cic = document.createElement('span');
  cic.className = 'nav-icon';
  cic.textContent = '➕';
  create.appendChild(cic);
  create.appendChild(document.createTextNode(' Create club'));
  parent.insertBefore(create, anchor);
})();
</script>
</body>
